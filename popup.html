<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PromptShelf</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon-wrap" aria-hidden="true">
            <img class="brand-icon" src="icons/icon-48.png" alt="">
          </span>
          <div>
            <h1>PromptShelf</h1>
            <p id="folder-label" class="muted">No folder selected</p>
          </div>
        </div>
        <div class="top-actions">
          <span id="prompt-count" class="prompt-count">0 prompts</span>
          <button id="choose-folder" class="button secondary" type="button">Choose folder</button>
        </div>
      </header>

      <section class="controls" aria-label="Prompt controls">
        <label class="search-wrap">
          <span class="sr-only">Search prompts</span>
          <input id="search" type="search" placeholder="Find by name, tag, or purpose" autocomplete="off">
        </label>

        <div class="control-row">
          <div class="agent-group">
            <label class="agent-label" for="agent">Copy for</label>
            <span
              class="tooltip"
              tabindex="0"
              data-tip="Some prompts have Codex- or Claude-specific sections. This chooses which version gets copied."
              aria-label="Some prompts have Codex- or Claude-specific sections. This chooses which version gets copied."
            >?</span>
            <span id="agent-help" class="sr-only">
              Some prompts have Codex- or Claude-specific sections. This chooses which version gets copied.
            </span>
            <select id="agent" aria-describedby="agent-help">
              <option value="codex" selected>Codex</option>
              <option value="claude">Claude</option>
              <option value="all">All</option>
            </select>
          </div>
          <button id="refresh" class="button ghost" type="button">Refresh</button>
        </div>
      </section>

      <section id="empty-state" class="empty" hidden>
        <div class="empty-art" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <h2>Choose a prompt shelf</h2>
        <p>Select the markdown prompt folder you want to browse.</p>
      </section>

      <section id="content" class="content" hidden>
        <aside class="list-pane" aria-label="Prompts">
          <div class="pane-label">Library</div>
          <div id="prompt-list" class="prompt-list" role="listbox" aria-label="Prompts"></div>
        </aside>

        <article class="preview-pane" aria-label="Prompt preview">
          <div class="preview-header">
            <div class="preview-title">
              <h2 id="prompt-title">Select a prompt</h2>
              <p id="prompt-description" class="muted"></p>
            </div>
            <div class="preview-actions">
              <span id="save-state" class="save-state" aria-live="polite"></span>
              <button id="edit" class="button secondary" type="button">Edit</button>
              <button id="copy" class="button primary" type="button">Copy</button>
            </div>
          </div>
          <textarea id="preview" class="preview" spellcheck="false" readonly></textarea>
        </article>
      </section>

      <footer class="statusbar">
        <span id="status">Ready</span>
        <span id="sync-time"></span>
      </footer>
    </main>

    <script src="prompt-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
